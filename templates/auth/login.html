{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card animate-fade-up">
    <div class="auth-logo">
      <div class="logo-icon">🌿</div>
      <h2>Welcome Back</h2>
      <p>Sign in to Smart F2C Connect</p>
    </div>

    <div class="role-tabs">
      <button class="role-tab active" data-role="farmer"   type="button">🌾 Farmer</button>
      <button class="role-tab"        data-role="consumer" type="button">🛒 Consumer</button>
      <button class="role-tab"        data-role="admin"    type="button">🔑 Admin</button>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <input type="hidden" name="role" id="roleInput" value="farmer">

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <span class="icon">✉️</span>
          <input class="form-control" type="email" name="email" placeholder="you@email.com" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <span class="icon">🔒</span>
          <input class="form-control" type="password" name="password" placeholder="Your password" required id="pwdInput">
          <span id="togglePwd" style="position:absolute;right:.9rem;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-light)" onclick="togglePassword()">👁</span>
        </div>
      </div>

      <button class="btn btn-primary btn-full btn-lg mt-2" type="submit">Login & Get OTP →</button>
    </form>

    <div class="divider" style="margin-top:1.2rem">new here?</div>
    <a href="{{ url_for('register') }}" class="btn btn-outline btn-full">Create Account</a>

    <p class="text-center text-muted mt-3" style="font-size:.8rem">
      🔒 Your login is secured with OTP verification
    </p>
  </div>
</div>

<script>
function togglePassword(){
  const i = document.getElementById('pwdInput');
  i.type = i.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
