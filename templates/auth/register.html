{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card animate-fade-up" style="max-width:560px">
    <div class="auth-logo">
      <div class="logo-icon">🌿</div>
      <h2>Create Account</h2>
      <p>Join Smart F2C Connect – the direct farm marketplace</p>
    </div>

    <!-- Role Tabs -->
    <div class="role-tabs">
      <button class="role-tab active" data-role="farmer" type="button">🌾 Farmer</button>
      <button class="role-tab" data-role="consumer" type="button">🛒 Consumer</button>
    </div>

    <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="role" id="roleInput" value="farmer">

      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <div class="input-icon-wrap">
          <span class="icon">👤</span>
          <input class="form-control" type="text" name="name" placeholder="Your full name" required>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input class="form-control" type="email" name="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input class="form-control" type="tel" name="phone" placeholder="10-digit number" required>
        </div>
      </div>

      <!-- Farmer fields -->
      <div class="form-group" data-role-field="farmer">
        <label class="form-label">Farm Name</label>
        <input class="form-control" type="text" name="farm_name" placeholder="e.g. Green Valley Organics">
      </div>
      <div class="form-group" data-role-field="farmer">
        <label class="form-label">Farm Location</label>
        <input class="form-control" type="text" name="location" placeholder="Village / Town, District">
      </div>

      <!-- Consumer fields -->
      <div class="form-group" data-role-field="consumer" style="display:none">
        <label class="form-label">Delivery Address</label>
        <textarea class="form-control" name="address" rows="2" placeholder="Your full delivery address"></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input class="form-control" type="password" name="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input class="form-control" type="password" id="confirmPwd" placeholder="Re-enter password" required>
        </div>
      </div>

      <button class="btn btn-primary btn-full btn-lg mt-2" type="submit">Create Account →</button>
    </form>

    <div class="divider">already have an account?</div>
    <a href="{{ url_for('login') }}" class="btn btn-outline btn-full">Login</a>
  </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e){
  const p1 = document.querySelector('[name=password]').value;
  const p2 = document.getElementById('confirmPwd').value;
  if(p1 !== p2){ e.preventDefault(); alert('Passwords do not match!'); }
});
</script>
{% endblock %}
